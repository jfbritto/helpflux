<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Nutriii symbol: the app icon. A rounded tile (radius 115,
    22.5%) with the brand diagonal gradient (brand-500 #8a59f6 to brand-700
    #5d1cb6) and, in white, an "n" (Plus Jakarta Sans ExtraBold outline)
    under the three dots of the wordmark, in the same arc (the middle one
    higher).
    Use it above 32px; at 32px and below use symbol-small.svg.
    The <x-logo variant="symbol"> component inlines it, so every id is
    prefixed with "nutriii-logo-" (the component makes them unique per
    instance). public/apple-touch-icon.png and mail-logo.png are rendered
    from it (resources/brand/generate-web-assets.mjs). See docs/BRAND.md.
  -->
  <defs><linearGradient id="nutriii-logo-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a59f6"/><stop offset="1" stop-color="#5d1cb6"/></linearGradient></defs>
  <rect width="512" height="512" rx="115" fill="url(#nutriii-logo-bg)"/>
