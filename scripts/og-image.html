<!doctype html>
<!--
  Imagem de compartilhamento (Open Graph) do site: 1200x630.
  Ao mudar, gere de novo o PNG usado pelo Next.js:

  npx playwright screenshot --viewport-size=1200,630 --wait-for-timeout=1500 \
    "file://$PWD/scripts/og-image.html" src/app/opengraph-image.png
-->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500&family=Poppins:wght@500;600&display=swap">
<style>
  html, body { margin: 0; }

  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    position: relative;
    background: #EEF1F0;
    color: #0F1E27;
    font-family: 'DM Sans', sans-serif;
  }

  .grid {
    position: absolute;
    inset: 0;
    background-image: radial-gradient(rgba(15, 30, 39, 0.11) 1.5px, transparent 1.5px);
    background-size: 28px 28px;
    -webkit-mask-image: radial-gradient(ellipse at center, black 20%, transparent 70%);
    mask-image: radial-gradient(ellipse at center, black 20%, transparent 70%);
  }

  .lockup {
    position: absolute;
    inset: 0 0 34px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .wordmark {
    margin-top: 26px;
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
    font-size: 82px;
    line-height: 1;
    letter-spacing: -0.02em;
  }

  .dots {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 22px;
  }

  .dots span { border-radius: 50%; background: currentColor; }
  .dots span:nth-child(odd) { width: 9px; height: 9px; }
  .dots span:nth-child(2) { width: 16px; height: 16px; }

  .tagline {
    margin-top: 30px;
    font-family: 'Poppins', sans-serif;
    font-weight: 500;
    font-size: 30px;
    letter-spacing: -0.01em;
  }

  .highlight {
    background: linear-gradient(transparent 58%, #D5DEE0 58%, #D5DEE0 92%, transparent 92%);
    padding: 0 0.08em;
  }

  .footer {
    position: absolute;
    left: 64px;
    right: 64px;
    bottom: 38px;
    display: flex;
    justify-content: space-between;
    font-size: 20px;
    font-weight: 500;
    color: #53646D;
  }

  .footer strong { color: #0F1E27; font-weight: 500; }
</style>
</head>
<body>
  <div class="grid"></div>

  <div class="lockup">
    <!-- Símbolo (mesmo desenho de src/components/Logo.tsx) -->
    <svg width="168" height="226" viewBox="0 0 76 102" fill="none" xmlns="http://www.w3.org/2000/svg">

        <path d="M20.32,57.62 C23.82,61.62 28.5,66 28.5,75 M55.68,57.62 C52.18,61.62 47.5,66 47.5,75"/>
        <path d="M20.5,34 a17.5,17.5 0 1 0 35,0 a17.5,17.5 0 1 0 -35,0"/>
        <path d="M34.3,75 V41.5 C34.3,38 31.3,36.5 31.3,32.5 M41.7,75 V41.5 C41.7,38 44.7,36.5 44.7,32.5"/>
        <path d="M25.5,76.5 H50.5 M26,83.5 H50 M26.5,90.5 H49.5"/>
        <path d="M30,91.5 C30,96 33.5,98.5 38,98.5 C42.5,98.5 46,96 46,91.5"/>

    <div class="wordmark">HelpFlux</div>
    <div class="dots"><span></span><span></span><span></span></div>
    <div class="tagline">Criamos SaaS que <span class="highlight">simplificam negócios</span></div>
  </div>

  <div class="footer">
    <strong>helpflux.com.br</strong>
    <!-- Cantos ficam fora do recorte quadrado central que o WhatsApp às vezes usa -->
    <span>SaaS House</span>
  </div>
</body>
</html>
